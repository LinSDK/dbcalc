<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>dB Meter</title>
  <!-- Meter gauge: half-ring (centre 128,168, r 88, stroke 30) from 180° to 360°; the last 45° is the red zone.
       The needle points into it at 315°. Gauge sits slightly above the optical centre of the tile. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#15171E"/>
  <path d="M 40 168 A 88 88 0 0 1 190.2 105.8" fill="none" stroke="#F2F3F5" stroke-width="30" stroke-linecap="round"/>
  <path d="M 190.2 105.8 A 88 88 0 0 1 216 168" fill="none" stroke="#E83030" stroke-width="30" stroke-linecap="round"/>
  <path d="M 128 168 L 175 121" fill="none" stroke="#F2F3F5" stroke-width="18" stroke-linecap="round"/>
  <circle cx="128" cy="168" r="20" fill="#F2F3F5"/>
</svg>
